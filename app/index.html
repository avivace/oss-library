<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OSS Library</title>
    <link rel="canonical" href="https://ossl.avivace.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ossl.avivace.com/" />
    <meta property="og:title" content="OSS Library" />
    <meta property="og:description" content="A curated collection of books, articles, talks, papers, blog posts, podcasts and opinions on FOSS, licenses and OSPOs." />
    <meta name="description" content="A curated collection of books, articles, talks, papers, blog posts, podcasts and opinions on FOSS, licenses and OSPOs." />
    <script>
      // Apply the saved theme before first paint to avoid a flash
      try {
        const theme = localStorage.getItem('theme')
        if (theme) document.documentElement.dataset.theme = theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
